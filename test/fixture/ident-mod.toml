use_canonical_type = true

[clang]
downgrade_all_warnings = false
downgrade_warnings = ["-Wsign-conversion"]

[migration]
legacy_prefixes = true

[variables]
case = "pascal"

[scan]
local = true
static_local = true
member = true
static_member = true
global = true
static_global = true
functions = true

[scope]
local = ""
static_local = "s_"
member = "m_"
static_member = "s_"
global = "g_"
static_global = "s_"

[scope_alternatives.const]
global = ["upper_snake"]

[functions]
member = "camel"
free = "pascal"

[pointers]
marker = "p"
char = "s"

[types]
int = "n"
double = "d"
"project::Request" = "req"
"project::String" = "s"
